<body>
<header><span class="badge" style="background:rgba(255,255,255,.2)">Latihan Soal</span><h1>TKA Bahasa Indonesia SMA/SMK</h1><p style="font-weight:700" id="hp"></p><p>Pemahaman Tekstual · Inferensial · Evaluasi &amp; Apresiasi</p><p style="font-weight:700;font-size:.8rem">Guru pengampu: Prasetyo Adi Wibowo, M.Pd. · SMK Telkom Purwokerto</p></header>
<div class="bar"><div class="bi"><div class="seg2"><button data-mode="latihan" class="on">Latihan</button><button data-mode="simulasi">Simulasi ujian</button><button id="hasil">📊 Hasil</button><button data-fs="-1" aria-label="Perkecil huruf">A−</button><button data-fs="1" aria-label="Perbesar huruf">A+</button><button data-guide>📖 Pedoman</button><select id="pksel" aria-label="Pilih paket"><option value="A">Paket A</option><option value="B">Paket B</option></select><button data-theme-toggle aria-label="Ganti tema">🌓</button><button class="btn" id="fin-sim" hidden style="padding:5px 12px;font-size:.8rem;border-radius:10px">Selesaikan ujian</button><span id="clock"></span></div><div class="tabs" id="tabs"></div><div class="st"><span id="s1"></span><span id="s2"></span><button class="btn g" style="padding:2px 12px;font-size:.8rem" id="rs">Ulangi semua</button></div></div></div>
<main id="app"></main>
<footer style="text-align:center;color:var(--mu);font-size:.85rem;padding:0 16px 28px">Guru pengampu: Prasetyo Adi Wibowo, M.Pd. · SMK Telkom Purwokerto</footer>
<script>
// Paket A (41 soal). Format soal: [no, kompetensi, pertanyaan, [opsi], indeks jawaban, pembahasan] ; Benar/Salah: [no, kompetensi, pertanyaan, [pernyataan], [1=Benar/0=Salah], pembahasan]
// Pilih DUA: [no, kompetensi, pertanyaan, [opsi], {m:[indeks benar]}, pembahasan]. Benar/Salah dapat membawa label ke-7: ["Sesuai","Tidak Sesuai"].
const PK={"A":{"D":[{"t":"TKA 2026 dan Integrasi AN","k":"Nonfiksi · Informasi","p":"<b>TKA 2026 dan Integrasi Asesmen Nasional: Kebijakan Baru dalam Evaluasi Pendidikan</b>\nKementerian Pendidikan Dasar dan Menengah (Kemendikdasmen) resmi mengintegrasikan pelaksanaan Tes Kemampuan Akademik (TKA) jenjang SMA/SMK/sederajat tahun 2026 dengan Asesmen Nasional (AN). Kebijakan ini menjadi yang pertama kali diterapkan dalam sejarah penyelenggaraan tes di jenjang menengah atas.\nKepala Pusat Asesmen Pendidikan Kemendikdasmen, Rahmawati, menjelaskan bahwa integrasi materi AN diterapkan pada tiga mata pelajaran wajib, yaitu Bahasa Indonesia, Bahasa Inggris, dan Matematika. Pada hari pertama pelaksanaan TKA, murid akan mengerjakan mata pelajaran Bahasa Indonesia wajib yang disisipi soal literasi membaca.\nRahmawati menegaskan bahwa tidak ada perbedaan signifikan antara mengerjakan soal Bahasa Indonesia TKA dengan literasi membaca di Asesmen Nasional. Materi yang disajikan dalam soal Bahasa Indonesia TKA mencakup teks sastra, nonfiksi, maupun teks informasi. Siswa diuji melalui beragam tingkatan soal untuk menilai kompetensi pemahaman bacaan. Level soal bergerak dari sekadar mengakses informasi yang ada di wacana, menginterpretasi atau mengintegrasikan informasi, sampai mengevaluasi teks yang disajikan.\nSementara itu, materi tes UTBK SNBT 2026 yang menjadi acuan pengembangan soal juga menunjukkan struktur serupa. Tes Literasi dalam UTBK SNBT terdiri dari tiga subtes: Literasi Bahasa Indonesia (30 soal), Literasi Bahasa Inggris (20 soal), dan Penalaran Matematika (20 soal). Model soal yang digunakan mencakup pilihan ganda dengan lima opsi, pilihan majemuk kompleks dalam bentuk tabel, dan soal isian singkat.\nDengan integrasi ini, siswa diharapkan tidak hanya menghafal materi, tetapi juga mengembangkan kemampuan berpikir kritis, analitis, serta manajemen waktu saat ujian berlangsung. Pemahaman terhadap struktur dan karakter soal menjadi kunci untuk meningkatkan peluang keberhasilan dalam menghadapi TKA 2026.\n<small><i>Sumber: Disadur dari Zenius, Detikcom, dan Pusmendik Kemendikdasmen (dengan penyesuaian).</i></small>","q":[[1,"Tekstual – Gagasan Utama","Gagasan utama paragraf pertama teks tersebut adalah …",["Sejarah penyelenggaraan TKA di Indonesia","Integrasi TKA dengan Asesmen Nasional pada 2026","Peran Kemendikdasmen dalam penyelenggaraan ujian","Perbedaan TKA dan UTBK SNBT","Manfaat Asesmen Nasional bagi siswa SMA"],1,"Paragraf pertama menyatakan Kemendikdasmen mengintegrasikan TKA 2026 dengan Asesmen Nasional; inilah gagasan utamanya."],[2,"Tekstual – Makna Kata","Makna kata <i>integrasi</i> dalam teks tersebut adalah …",["Pemisahan dua sistem yang berbeda","Penggabungan dua hal menjadi satu kesatuan","Penghapusan satu program pendidikan","Perbandingan antara dua kebijakan","Penggantian sistem lama dengan sistem baru"],1,"<i>Integrasi</i> berarti penyatuan atau penggabungan beberapa hal menjadi satu kesatuan (TKA digabung dengan AN)."],[3,"Tekstual – Informasi Rinci","Menurut teks tersebut, mata pelajaran yang disisipi soal Asesmen Nasional adalah …",["Bahasa Indonesia, Bahasa Inggris, dan Matematika","Bahasa Indonesia, IPA, dan IPS","Matematika, Fisika, dan Kimia","Bahasa Inggris, Sejarah, dan Ekonomi","Semua mata pelajaran wajib"],0,"Teks menyebut tiga mata pelajaran wajib: Bahasa Indonesia, Bahasa Inggris, dan Matematika."],[4,"Tekstual – Pernyataan Tidak Sesuai","Pernyataan yang <b>TIDAK SESUAI</b> dengan isi teks adalah …",["TKA 2026 merupakan kali pertama digabungkan dengan Asesmen Nasional","Soal literasi membaca di TKA dan AN hampir tidak ada bedanya","Pada hari pertama TKA, murid mengerjakan Bahasa Indonesia yang disisipi soal literasi membaca","Materi Bahasa Indonesia TKA hanya mencakup teks sastra","Level soal bergerak dari mengakses hingga mengevaluasi informasi"],3,"Teks menyebut materi TKA mencakup teks sastra, nonfiksi, <i>maupun</i> teks informasi, jadi pernyataan \"hanya teks sastra\" bertentangan dengan isi teks."],[5,"Inferensial – Tujuan Penulis","Tujuan penulis menyajikan teks tersebut adalah …",["Mengkritik kebijakan Kemendikdasmen","Menjelaskan integrasi TKA dan Asesmen Nasional","Membandingkan TKA dengan ujian internasional","Mempromosikan bimbingan belajar tertentu","Menolak pelaksanaan TKA 2026"],1,"Teks bersifat informatif: memaparkan kebijakan integrasi TKA dan AN beserta ciri soalnya."],[6,"Inferensial – Hubungan Antarparagraf","Hubungan makna antara paragraf ketiga dan keempat adalah …",["Paragraf ketiga menjelaskan sebab, paragraf keempat menjelaskan akibat","Paragraf keempat memperkuat penjelasan pada paragraf ketiga","Paragraf ketiga dan keempat saling bertentangan","Paragraf keempat menyangkal pernyataan paragraf ketiga","Paragraf ketiga adalah simpulan, paragraf keempat adalah contoh"],1,"Paragraf berikutnya melanjutkan dengan penanda <i>sementara itu</i> dan memberi acuan serupa (struktur UTBK), sehingga memperkuat penjelasan sebelumnya."],[7,"Tekstual – Informasi Rinci","Informasi yang terdapat pada paragraf keempat adalah …",["Struktur soal Literasi Bahasa Indonesia dalam UTBK SNBT","Jadwal pelaksanaan UTBK SNBT 2026","Jumlah peserta TKA 2026","Sejarah Asesmen Nasional","Perbandingan kurikulum SMA dan SMK"],0,"Paragraf keempat memuat struktur Tes Literasi UTBK SNBT (30, 20, dan 20 soal). Jadwal, jumlah peserta, sejarah AN, dan kurikulum tidak disebut."],[8,"Tekstual – Makna Kata","Makna kata <i>wacana</i> dalam konteks teks tersebut adalah …",["Diskusi terbuka antar siswa","Teks atau bacaan yang disajikan","Pertanyaan ujian yang sulit","Jawaban yang harus dihafal","Sistem penilaian otomatis"],1,"Dalam kalimat \"mengakses informasi yang ada di wacana\", <i>wacana</i> berarti teks atau bacaan yang disajikan."],[9,"Inferensial – Pemahaman Isi","Pernyataan yang tepat berdasarkan paragraf ketiga adalah …",["Soal TKA hanya menguji kemampuan mengingat","Kompetensi yang diuji mencakup akses, interpretasi, dan evaluasi","Materi TKA hanya berupa teks fiksi","Siswa tidak perlu memahami konteks bacaan","Tingkatan soal TKA lebih rendah dari AN"],1,"Teks menyebut level soal dari mengakses, menginterpretasi/mengintegrasikan, sampai mengevaluasi informasi."],[10,"Inferensial – Simpulan","Simpulan yang paling tepat berdasarkan teks tersebut adalah …",["TKA 2026 hanya menguji kemampuan menghafal siswa","Integrasi TKA dan AN bertujuan mengembangkan berpikir kritis siswa","Asesmen Nasional tidak berkaitan dengan TKA","UTBK SNBT tidak memiliki kemiripan dengan TKA","Siswa tidak perlu mempersiapkan diri menghadapi TKA"],1,"Paragraf penutup menyatakan siswa diharapkan mengembangkan berpikir kritis, analitis, dan manajemen waktu."],[11,"Tekstual – Pilih Dua Pernyataan","Pilihlah <b>DUA</b> pernyataan yang benar berdasarkan teks tersebut!",["Integrasi TKA dengan AN berlaku untuk semua mata pelajaran","Materi AN diintegrasikan pada tiga mata pelajaran wajib","Soal literasi membaca di TKA dan AN hampir sama","TKA 2026 hanya diikuti oleh siswa kelas 10","Materi TKA hanya berupa teks nonfiksi"],{"m":[1,2]},"B dan C benar: integrasi pada tiga mata pelajaran wajib, dan tidak ada perbedaan signifikan antara soal literasi TKA dan AN. A salah (hanya tiga mapel, bukan semua), D dan E salah."],[12,"Tekstual – Sesuai/Tidak Sesuai","Tentukan <b>Sesuai</b> atau <b>Tidak Sesuai</b> untuk setiap pernyataan berikut berdasarkan teks!",["TKA 2026 merupakan kali pertama digabung dengan Asesmen Nasional.","Soal Bahasa Indonesia TKA hanya menguji kemampuan menghafal.","Level soal TKA mencakup mengakses, menginterpretasi, dan mengevaluasi.","UTBK SNBT memiliki subtes Penalaran Matematika sebanyak 20 soal."],[1,0,1,1],"1 Sesuai (pertama kali). 2 Tidak sesuai: soal menguji pemahaman bacaan bertingkat. 3 Sesuai. 4 Sesuai (20 soal).",["Sesuai","Tidak Sesuai"]],[13,"Tekstual – Benar/Salah","Tentukan <b>Benar</b> atau <b>Salah</b> untuk pernyataan tentang model soal UTBK SNBT 2026 berdasarkan teks!",["Model soal mencakup pilihan ganda dengan lima opsi.","Terdapat soal isian singkat dalam UTBK SNBT 2026.","Soal esai panjang menjadi model utama UTBK SNBT."],[1,1,0],"Teks menyebut tiga model: pilihan ganda lima opsi, pilihan majemuk kompleks, dan isian singkat. Esai panjang tidak disebut.",["Benar","Salah"]],[14,"Tekstual – Pilih Dua Pernyataan","Pilihlah <b>DUA</b> pernyataan yang sesuai dengan struktur tes UTBK SNBT 2026 berdasarkan teks!",["Literasi Bahasa Indonesia terdiri dari 30 soal","Literasi Bahasa Inggris terdiri dari 25 soal","Penalaran Matematika terdiri dari 20 soal","Total soal UTBK SNBT adalah 100 soal","Tidak ada subtes Penalaran Matematika"],{"m":[0,2]},"Teks: Literasi Bahasa Indonesia 30 soal, Literasi Bahasa Inggris 20 soal, Penalaran Matematika 20 soal (total 70, bukan 100)."],[15,"Tekstual – Benar/Salah","Tentukan <b>Benar</b> atau <b>Salah</b> untuk pernyataan tentang tujuan integrasi TKA dan AN!",["Siswa diharapkan mengembangkan kemampuan berpikir kritis.","Siswa hanya perlu menghafal materi untuk menghadapi TKA.","Manajemen waktu saat ujian menjadi salah satu kemampuan yang dikembangkan."],[1,0,1],"Paragraf terakhir: siswa tidak hanya menghafal, tetapi berpikir kritis, analitis, dan mampu mengatur waktu.",["Benar","Salah"]]]},{"t":"Seragam","k":"Fiksi · Cerpen","p":"<b>Seragam</b>\nHampir 25 tahun lalu kami berpisah karena keluarga saya harus boyongan ke kota tempat kerja Ayah yang baru di luar pulau. Tak satupun barang tertinggal di rumah lama. Begitu juga dengan sahabatku, kami harus berpisah.\nBertemu dengannya setelah sekian lama, mengingatkan kembali pada pengalaman kami dahulu. Pengalaman yang menjadikan dia, walau tidak setiap waktu, selalu lekat di ingatan saya. Tentu dia mengingatnya pula, bahkan saya yakin rasa yang diidapnya lebih besar efeknya. Karena sebagai seorang sahabat, dia jelas jauh lebih tulus dan setia daripada saya. Tak terasa mata saya mulai berkaca-kaca.\nSaat malam itu saya berada di sini, memperhatikannya belajar. Selesai belajar, dia menyuruh saya pulang karena hendak pergi mencari jangkrik. Saya langsung menyatakan ingin ikut, tapi dia keberatan. Ayah dan ibunya pun melarang. Saya sering mendengar cerita mengasyikan anak-anak beramai-ramai berangkat ke sawah selepas isya untuk mencari jangkrik. Sayang, Ayah tidak pernah membolehkan saya. Tapi malam itu saya nekat dan sahabat saya itu akhirnya tidak kuasa menolak. “Tidak ganti baju?” tanya saya heran begitu dia langsung memimpin untuk berangkat. Itu hari Jumat. Seragam coklat Pramuka yang dikenakannya sejak pagi masih akan terpakai untuk bersekolah sehari lagi. Dia memang tidak memiliki banyak pakaian hingga seragam sekolah biasa dipakai kapan saja. Tapi memakainya untuk pergi ke sawah mencari jangkrik, rasanya sangat tidak elok.\nSaya mengambil alih obor dari tangannya. Rasanya belum terlalu lama kami berada di sana dan bumbung baru terisi beberapa ekor jangkrik ketika tiba-tiba angin berubah perangai. Kaget, pantat obor itu justru saya angkat tinggi-tinggi sehingga minyak mendorong sumbunya terlepas. Api dengan cepat berpindah membakar punggung saya! Terdengar teriakannya sembari melepaskan seragam coklatnya untuk dipakai menyabet punggung saya. Baju yang saya kenakan habis sepertiganya. Sahabat saya itu tanggap melingkupi tubuh saya dengan seragam coklatnya melihat saya mulai menangis dan menggigil antara kesakitan dan kedinginan. Sadar saya membutuhkan pertolongan secepatnya, dia menggendong saya lalu berlari sembari membujuk-bujuk saya untuk tetap tenang. Napasnya memburu kelelahan, tapi rasa tanggung jawab yang besar seperti memberinya kekuatan berlipat untuk tetap bersama saya.\n<small><i>(Kutipan cerpen “Seragam” karya Aris Kurniawan Basuki dengan penyesuaian)</i></small>","q":[[16,"Tekstual – Latar Waktu","Latar waktu yang tergambar dalam cerita tersebut adalah …",["Pagi hari","Siang hari","Sore hari","Malam hari","Dini hari"],3,"Petunjuk: \"malam itu\", berangkat ke sawah \"selepas isya\", dan membawa obor."],[17,"Tekstual – Penokohan","Bagaimana sifat yang dimiliki oleh sahabat tokoh “saya”?",["Penakut dan pemalas","Tulus, setia, dan bertanggung jawab","Egois dan tidak peduli","Sombong dan angkuh","Ceroboh dan lalai"],1,"Tokoh \"saya\" menyebutnya tulus dan setia, dan tindakannya menolong menunjukkan tanggung jawab."],[18,"Tekstual – Sebab Peristiwa","Apa yang menyebabkan tokoh “saya” mengalami luka bakar?",["Sahabatnya sengaja membakar punggungnya","Obor yang dibawanya terjatuh karena angin","Minyak dari pantat obor yang diangkat tinggi menyambar punggungnya","Api unggun yang dibuat untuk mencari jangkrik","Seragam Pramuka yang dikenakannya terbakar"],2,"Karena angin berubah, obor diangkat tinggi, minyak mendorong sumbu terlepas, dan api membakar punggung tokoh \"saya\"."],[19,"Inferensial – Alasan Tindakan","Mengapa sahabat tokoh “saya” memakai seragam Pramuka saat mencari jangkrik?",["Karena ia bangga dengan seragamnya","Karena ia tidak memiliki banyak pakaian","Karena ia baru pulang sekolah","Karena ia ingin terlihat rapi","Karena seragam itu adalah pemberian tokoh “saya”"],1,"Teks: \"Dia memang tidak memiliki banyak pakaian hingga seragam sekolah biasa dipakai kapan saja.\""],[20,"Tekstual – Urutan Peristiwa","Apa yang dilakukan sahabat tokoh “saya” setelah api membakar punggung tokoh “saya”?",["Meninggalkan tokoh “saya” untuk mencari bantuan","Melepaskan seragamnya dan menyabet punggung tokoh “saya”","Menangis dan panik tidak karuan","Berlari pulang untuk memanggil orang tua","Memadamkan api dengan air sungai"],1,"Ia melepas seragam coklatnya untuk menyabet punggung tokoh \"saya\", lalu melingkupi dan menggendongnya."],[21,"Inferensial – Hubungan Antarparagraf","Hubungan makna antara paragraf ketiga dan keempat adalah …",["Paragraf ketiga menjelaskan latar belakang, paragraf keempat menjelaskan akibat","Paragraf keempat adalah kelanjutan peristiwa dari paragraf ketiga","Paragraf ketiga dan keempat tidak saling berhubungan","Paragraf keempat menyangkal peristiwa di paragraf ketiga","Paragraf ketiga adalah simpulan, paragraf keempat adalah contoh"],1,"Paragraf ketiga menceritakan niat dan keberangkatan ke sawah; paragraf keempat melanjutkannya dengan peristiwa terbakarnya punggung."],[22,"Evaluasi – Nilai Moral","Nilai moral yang paling menonjol dalam cerpen tersebut adalah …",["Kejujuran dalam berkata","Kesetiaan dan pengorbanan seorang sahabat","Kerja keras mencari rezeki","Kepatuhan kepada orang tua","Keberanian menghadapi bahaya"],1,"Sahabat mengorbankan satu-satunya seragam yang ia punya dan menolong dengan sepenuh tenaga."],[23,"Inferensial – Prediksi Peristiwa","Jika sahabat tokoh “saya” tidak segera melepas seragamnya untuk menyabet api, apa yang paling mungkin terjadi pada tokoh “saya”?",["Luka bakar di punggung tokoh “saya” akan lebih parah","Obor itu tidak akan pernah terlepas sumbunya","Sahabatnya akan melanjutkan mencari jangkrik","Ayah tokoh “saya” akan mengizinkannya ke sawah","Api akan padam dengan sendirinya"],0,"Seragam dipakai menyabet dan memadamkan api yang membakar punggung. Tanpa tindakan itu, api bertahan lebih lama dan luka lebih parah. Opsi lain tidak didukung alur cerita."],[24,"Tekstual – Pilih Dua Pernyataan","Pilihlah <b>DUA</b> pernyataan yang benar berdasarkan cerpen tersebut!",["Sahabat tokoh “saya” memiliki banyak pakaian","Seragam Pramuka digunakan sahabat untuk menyabet api","Tokoh “saya” mengalami luka bakar di punggung","Sahabat tokoh “saya” meninggalkannya sendirian","Peristiwa terjadi pada siang hari"],{"m":[1,2]},"B dan C sesuai teks. A salah (tidak punya banyak pakaian), D salah (menggendong), E salah (malam hari)."],[25,"Inferensial – Tepat/Tidak Tepat","Tentukan <b>Tepat</b> atau <b>Tidak Tepat</b> untuk setiap pernyataan berikut berdasarkan cerpen!",["Seragam coklat sahabat digunakan untuk memadamkan api sekaligus melindungi tubuh tokoh “saya”.","Tindakan sahabat menunjukkan ia mengutamakan keselamatan tokoh “saya” daripada barang miliknya.","Sahabat menyuruh tokoh “saya” berjalan sendiri pulang ke rumah."],[1,1,0],"1 Tepat: seragam dipakai menyabet api lalu melingkupi tubuh tokoh \"saya\". 2 Tepat: ia rela melepas satu-satunya seragam. 3 Tidak tepat: ia menggendong dan berlari bersama tokoh \"saya\".",["Tepat","Tidak Tepat"]],[26,"Tekstual – Sesuai/Tidak Sesuai","Tentukan <b>Sesuai</b> atau <b>Tidak Sesuai</b> untuk pernyataan tentang tindakan sahabat berdasarkan cerpen!",["Sahabat melepaskan seragamnya untuk memadamkan api.","Sahabat menggendong tokoh “saya” sambil berlari.","Sahabat meninggalkan tokoh “saya” untuk mencari orang tuanya."],[1,1,0],"1 dan 2 tertulis jelas di paragraf terakhir. 3 tidak sesuai: ia membawa tokoh \"saya\" bersamanya.",["Sesuai","Tidak Sesuai"]],[27,"Evaluasi – Benar/Salah","Tentukan <b>Benar</b> atau <b>Salah</b> untuk pernyataan tentang nilai dalam cerpen!",["Cerpen ini menonjolkan nilai pengorbanan seorang sahabat.","Tokoh “saya” digambarkan sebagai pribadi yang patuh pada orang tua.","Sahabat tokoh “saya” menunjukkan tanggung jawab yang besar."],[1,0,1],"1 Benar. 2 Salah: Ayah tidak pernah membolehkan, tetapi tokoh \"saya\" nekat ikut. 3 Benar.",["Benar","Salah"]]]},{"t":"Mappalili","k":"Nonfiksi · Argumentasi","p":"<b>Mappalili: Antara Ritual Pertanian dan Solidaritas Warga</b>\nMappalili merupakan tradisi turun-temurun masyarakat Bugis-Makassar di Sulawesi Selatan yang menandai dimulainya musim tanam padi. Ritual ini dipimpin oleh seorang <i>pinati</i> (pemangku adat) dan biasanya dilakukan di sawah yang dianggap keramat. Dalam prosesinya, warga berkumpul membawa berbagai hasil bumi, lalu melakukan doa bersama dan menanam benih padi pertama. Tradisi ini bukan sekadar seremonial, melainkan wujud syukur kepada Sang Pencipta dan penghormatan kepada leluhur.\nNamun, di balik nilai spiritualnya, Mappalili juga mengandung dimensi sosial yang kuat. Warga saling bergotong royong membersihkan saluran irigasi, memperbaiki pematang sawah, dan membantu keluarga yang kesulitan tenaga. Semangat <i>sipakatau</i> (saling menghormati) dan <i>sipatuo</i> (saling menghidupi) menjadi landasan utama. Meski demikian, dalam beberapa dekade terakhir, tradisi ini mulai terkikis oleh modernisasi. Banyak petani muda beralih ke pekerjaan di kota, sehingga partisipasi dalam Mappalili menurun. Selain itu, alih fungsi lahan pertanian menjadi kawasan industri turut mengurangi luas sawah yang menjadi lokasi ritual.\nSebagian masyarakat masih mempertahankan Mappalili sebagai identitas budaya, tetapi sebagian lain menganggapnya kurang relevan dengan kehidupan modern. Oleh karena itu, diperlukan upaya untuk mengemas tradisi ini agar tetap diminati generasi muda, misalnya dengan menggabungkannya dengan festival budaya atau edukasi pertanian berkelanjutan.","q":[[28,"Tekstual – Makna Kata Serapan","Apa makna kata <i>pinati</i> pada teks tersebut?",["Pemimpin upacara adat yang dihormati","Petani senior yang memiliki sawah luas","Kepala desa yang mengatur irigasi","Tokoh masyarakat yang membagi hasil panen","Pemangku adat yang memimpin ritual pertanian"],4,"Teks menjelaskan <i>pinati</i> sebagai \"pemangku adat\" yang memimpin ritual pertanian."],[29,"Inferensial – Gagasan Pendukung","Manakah gagasan yang mendukung ide pokok bahwa Mappalili mengandung nilai gotong royong?",["Ritual dipimpin oleh seorang <i>pinati</i> di sawah keramat.","Warga membawa hasil bumi untuk didoakan bersama.","Warga saling membantu membersihkan saluran irigasi dan pematang sawah.","Tradisi ini mulai terkikis oleh modernisasi dan urbanisasi.","Alih fungsi lahan pertanian mengurangi lokasi ritual."],2,"Gotong royong terlihat dari warga yang saling membantu membersihkan saluran irigasi dan pematang sawah."],[30,"Inferensial – Hubungan Antarparagraf","Hubungan makna antara paragraf kedua dan ketiga adalah ...",["Paragraf kedua menjelaskan sebab, paragraf ketiga menjelaskan akibat.","Paragraf kedua memaparkan nilai positif, paragraf ketiga memaparkan tantangan.","Paragraf kedua memberikan contoh, paragraf ketiga memberikan perbandingan.","Paragraf kedua menegaskan, paragraf ketiga menyimpulkan.","Paragraf kedua mengkritik, paragraf ketiga memberikan solusi."],1,"Paragraf kedua memaparkan nilai positif (gotong royong, <i>sipakatau</i>, <i>sipatuo</i>), paragraf ketiga memaparkan tantangan."],[31,"Evaluasi – Kesesuaian Kesimpulan","\"Oleh karena itu, diperlukan upaya untuk mengemas tradisi ini agar tetap diminati generasi muda, misalnya dengan menggabungkannya dengan festival budaya atau edukasi pertanian berkelanjutan.\" Kalimat tersebut dapat menjadi kesimpulan yang sesuai teks argumentasi tersebut karena ...",["merangkum sebab-akibat dari terkikisnya tradisi Mappalili.","menyimpulkan ketidaksetujuan masyarakat terhadap penghapusan tradisi.","menyangkal pandangan negatif yang ada di masyarakat.","menyimpulkan solusi konkret untuk melestarikan tradisi Mappalili.","menggarisbawahi pentingnya tradisi di seluruh wilayah Sulawesi."],3,"Kalimat itu menyimpulkan solusi konkret agar tradisi tetap diminati generasi muda."]]},{"t":"Interaksi Sosial di Era Digital","k":"Nonfiksi · Eksposisi","p":"<b>Interaksi Sosial di Era Digital</b>\nPenggunaan telepon genggam menjadi kebutuhan pokok di era digital. Mayoritas masyarakat saat ini sudah menggunakan telepon genggam. Kemudahan akses informasi dan komunikasi yang diperoleh dari penggunaan telepon genggam memberikan manfaat sekaligus dampak yang masif terhadap interaksi sosial di tengah masyarakat.\nBerdasarkan data Badan Pusat Statistik (BPS), proporsi individu yang memiliki telepon genggam menurut kelompok umur didominasi oleh orang-orang dengan rentang usia 15-24. Artinya, masyarakat kelahiran tahun 2000 termasuk individu yang mendominasi pemilik dan pengguna telepon genggam. Individu pada rentang usia tersebut tergolong dalam generasi Z (gen-Z) yang lahir dan tumbuh pada era internet dan telepon genggam.\nPerubahan cara komunikasi dari tatap muka ke virtual seiring dengan berkembangnya telepon genggam menjadi ponsel pintar mengubah pola interaksi sosial. Dibanding ruang fisik, gen-Z lebih menyukai interaksi pada ruang virtual. Hal itu mengurangi kualitas interaksi sosial secara langsung. Dalam satu ruang yang sama, mereka bisa lebih fokus pada interaksi virtual melalui ponsel pintar daripada berkomunikasi langsung dengan orang-orang di sekitarnya. Perubahan pola interaksi sosial tersebut merupakan tantangan di era perkembangan teknologi.\nBerdasarkan hasil observasi yang dilakukan tahun 2020, sebagian besar informan menyatakan bahwa terdapat faktor eksternal dan internal yang menjadi pemicu terjadinya pergeseran pola interaksi dalam masyarakat. Pertama, faktor eksternal dari alat-alat canggih seperti ponsel pintar yang mampu menghubungkan komunikasi tanpa melalui tatap muka. Kedua, faktor internal berupa ketergantungan ponsel pintar dan perilaku phubbing.\nPergeseran pola interaksi sosial membuat nilai-nilai budaya seperti tenggang rasa, sopan santun, empati, dan kepedulian sosial menurun. Ungkapan \"mendekatkan yang jauh dan menjauhkan yang dekat\" pada era digital merupakan suatu realitas yang dapat menjadi bahan refleksi untuk semua orang.\nAdanya pergeseran pola interaksi sosial secara khusus menuntut orang tua memberikan pemahaman yang lebih pada anaknya agar tetap mempertahankan nilai budaya. Ponsel pintar terus berkembang setiap tahun dengan fitur-fitur yang menawarkan kepraktisan tanpa disadari akan mengontrol penggunanya untuk mengabaikan interaksi sosial secara langsung. Oleh karena itu, perlu kesadaran bersama untuk memanfaatkan ponsel pintar secara bijak tanpa mengabaikan interaksi sosial dalam ruang fisik. Upaya tersebut merupakan langkah nyata untuk melestarikan nilai-nilai budaya dan menjaga hubungan sosial.\n<small><i>Referensi: artikel ilmiah \"Pergeseran Pola Interaksi Sosial\" oleh Iva St Syahrah, dkk dan data BPS.</i></small>","q":[[32,"Tekstual – Makna Kata","Apa makna kata <i>phubbing</i> dalam teks tersebut?",["Kebiasaan mengabaikan lawan bicara karena fokus pada ponsel","Kegiatan berkomunikasi melalui aplikasi pesan singkat","Perilaku menggunakan ponsel untuk mengambil foto","Kebiasaan memeriksa notifikasi secara berulang","Aktivitas bermain game di ponsel saat waktu luang"],0,"<i>Phubbing</i> adalah kebiasaan mengabaikan lawan bicara karena fokus pada ponsel."],[33,"Inferensial – Gagasan Pendukung","Manakah gagasan yang mendukung bahwa ponsel pintar menimbulkan pergeseran pola komunikasi?",["Berkembangnya ponsel pintar mengubah interaksi sosial.","Gen-Z cenderung menyukai interaksi dalam ruang fisik.","Ponsel pintar membuat gen-Z berfokus pada ruang fisik.","Interaksi virtual membuat interaksi langsung berkurang.","Perubahan interaksi sosial adalah tantangan gen-Z."],3,"Gagasan pendukungnya: interaksi virtual membuat interaksi langsung berkurang."],[34,"Inferensial – Hubungan Antarparagraf","Hubungan makna antara paragraf tiga dan paragraf empat adalah ...",["Paragraf tiga merupakan akibat dari faktor-faktor pada paragraf empat.","Paragraf tiga merupakan sebab dari faktor-faktor pada paragraf empat.","Paragraf empat memperkuat persoalan yang dipaparkan pada paragraf tiga.","Paragraf empat merupakan rincian dari persoalan pada paragraf tiga.","Paragraf empat memperjelas gagasan yang ditunjukkan pada paragraf tiga."],2,"Paragraf empat memperkuat persoalan yang dipaparkan pada paragraf tiga."],[35,"Evaluasi – Kesesuaian Kesimpulan","\"Penggunaan ponsel pintar yang tidak bijak berdampak pada penurunan interaksi sosial dan nilai-nilai budaya.\" Kalimat tersebut dapat menjadi kesimpulan yang sesuai dari teks tersebut karena ...",["mewakili isi teks tentang dampak penggunaan ponsel pintar serta menegaskan agar bijak menggunakannya.","menegaskan pernyataan dalam teks tentang dampak penggunaan ponsel pintar bagi penggunanya yang bijak.","mewakili keseluruhan isi teks tentang perubahan nilai-nilai budaya akibat frekuensi penggunaan ponsel pintar.","menegaskan pernyataan dalam teks bahwa memanfaatkan ponsel pintar secara bijak adalah tanggung jawab individu.","mewakili keseluruhan isi teks tentang faktor yang berpengaruh terhadap penurunan interaksi sosial dan nilai budaya."],0,"Kalimat itu mewakili isi teks tentang dampak ponsel pintar serta menegaskan agar bijak menggunakannya."]]},{"t":"Literasi Digital","k":"Nonfiksi · Informasi","p":"<b>Literasi Digital: Kunci Menangkal Hoaks di Era Media Sosial</b>\nPerkembangan teknologi digital telah mengubah cara masyarakat memperoleh informasi. Media sosial kini menjadi sumber utama berita bagi sebagian besar generasi muda. Namun, kemudahan akses tersebut tidak selalu diiringi dengan kemampuan literasi yang memadai. Akibatnya, informasi palsu atau hoaks mudah tersebar dan memengaruhi opini publik.\nOleh karena itu, peningkatan literasi digital menjadi kebutuhan mendesak. Literasi digital tidak hanya berkaitan dengan kemampuan menggunakan perangkat teknologi, tetapi juga mencakup keterampilan berpikir kritis, memilah informasi, dan memahami konteks. Tanpa literasi yang baik, masyarakat berisiko menjadi korban manipulasi informasi.\n<small><i>Sumber: Disadur dari Radar Banyuwangi, Februari 2026.</i></small>","q":[[36,"Tekstual – Gagasan Utama","Gagasan utama paragraf pertama teks tersebut adalah …",["Perkembangan media sosial di kalangan generasi muda","Perubahan cara masyarakat memperoleh informasi akibat teknologi digital","Dampak negatif hoaks terhadap opini publik","Kelemahan media sosial sebagai sumber informasi","Pentingnya peningkatan literasi digital"],1,"Kalimat pembuka paragraf pertama (kalimat utama) menyatakan teknologi digital mengubah cara masyarakat memperoleh informasi; kalimat lain menjabarkannya."],[37,"Tekstual – Makna Kata","Makna kata <i>literasi</i> dalam konteks teks adalah …",["Kemampuan membaca dan menulis secara umum","Kecakapan menggunakan media sosial","Kemampuan memahami, mengolah, dan menilai informasi secara kritis","Keterampilan mengakses teknologi digital","Kemampuan menyebarkan informasi secara luas"],2,"Paragraf kedua menjelaskan literasi digital mencakup berpikir kritis, memilah informasi, dan memahami konteks."],[38,"Inferensial – Hubungan Antarkalimat","Hubungan antarkalimat dalam paragraf kedua ditandai oleh …",["Penambahan informasi","Pertentangan gagasan","Perbandingan","Penegasan dan penjelasan","Generalisasi"],3,"Kalimat pertama menegaskan kebutuhan literasi digital; kalimat berikutnya menjelaskan cakupannya dan risikonya."],[39,"Tekstual – Pernyataan Tidak Sesuai","Pernyataan yang <b>TIDAK SESUAI</b> dengan isi teks adalah …",["Media sosial menjadi sumber informasi utama generasi muda","Hoaks dapat memengaruhi opini publik","Literasi digital hanya berkaitan dengan penggunaan teknologi","Kurangnya literasi digital berisiko menimbulkan manipulasi informasi","Peningkatan literasi digital merupakan kebutuhan mendesak"],2,"Teks menyatakan literasi digital <i>tidak hanya</i> soal penggunaan perangkat, tetapi juga berpikir kritis, memilah informasi, dan memahami konteks."],[40,"Inferensial – Tujuan Penulis","Tujuan penulis menulis teks tersebut adalah …",["Mengkritik penggunaan media sosial","Menjelaskan bahaya teknologi digital","Mengajak masyarakat meningkatkan literasi digital","Menyajikan data perkembangan teknologi","Membandingkan media sosial dan media cetak"],2,"Judul dan paragraf kedua menekankan literasi digital sebagai kunci menangkal hoaks, sehingga penulis mengajak masyarakat meningkatkannya."],[41,"Tekstual – Pilih Dua Pernyataan","Pilihlah <b>DUA</b> pernyataan yang benar berdasarkan teks tersebut!",["Literasi digital mencakup kemampuan berpikir kritis","Hoaks hanya berdampak pada generasi muda","Media sosial memudahkan penyebaran informasi palsu","Literasi digital tidak berhubungan dengan konteks informasi","Masyarakat tidak berisiko menjadi korban manipulasi informasi meski literasinya rendah"],{"m":[0,2]},"A dan C benar (paragraf kedua dan pertama). B salah (hoaks memengaruhi opini publik secara umum), D salah (literasi mencakup memahami konteks), E bertentangan dengan kalimat terakhir teks."]]}],"TIPS":{"1":"Cari kalimat utama paragraf pertama (biasanya di awal). Pilih opsi yang mewakili seluruh paragraf, bukan satu rincian.","2":"Cari kata itu di teks, lalu lihat konteks kalimat. Pilih arti yang paling cocok dengan konteks.","3":"Cari kata kunci <i>tiga mata pelajaran wajib</i> pada paragraf kedua. Hindari opsi yang menambah mapel yang tidak disebut.","4":"Soal meminta yang <b>tidak sesuai</b>. Cek tiap opsi ke teks; yang bertentangan atau tidak ada di teks adalah jawabannya.","5":"Tujuan penulis dilihat dari jenis teks. Teks yang memaparkan kebijakan tanpa menilai bertujuan menginformasikan.","6":"Tandai kata penghubung antarparagraf (<i>sementara itu</i>) dan bandingkan isi kedua paragraf: menambah, menentang, atau menyimpulkan?","7":"Hitung paragraf isi dan cocokkan informasi yang ditanyakan dengan opsi. Coret opsi yang tidak ada di teks sama sekali.","8":"Ganti kata <i>wacana</i> di kalimatnya dengan tiap opsi. Pilih yang membuat kalimat tetap masuk akal.","9":"Baca ulang kalimat yang memuat tingkatan soal (mengakses, menginterpretasi, mengevaluasi). Coret opsi yang memakai kata ekstrem seperti <i>hanya</i>.","10":"Simpulan harus mewakili isi dan paragraf penutup. Waspadai opsi dengan kata <i>hanya</i>, <i>tidak</i>, atau <i>tidak perlu</i>.","11":"Soal pilih DUA. Cek tiap opsi satu per satu ke teks, lalu pilih dua yang terbukti benar. Coret opsi bertanda <i>semua</i> atau <i>hanya</i>.","12":"Nilai tiap pernyataan sendiri-sendiri. Cari bukti langsung di teks; kata <i>hanya</i> sering menandakan pernyataan salah.","13":"Cocokkan tiap pernyataan dengan kalimat penyebutan model soal di paragraf keempat.","14":"Catat angka tiap subtes (30, 20, 20), lalu hitung totalnya sebelum menilai opsi total soal.","15":"Cari kalimat tujuan di paragraf terakhir (berpikir kritis, analitis, manajemen waktu), lalu cocokkan.","16":"Cari penanda waktu dalam cerita: <i>malam itu</i>, <i>selepas isya</i>, obor.","17":"Nilai sifat tokoh dari ucapan dan tindakannya. Cari kata sifat yang diberikan narator.","18":"Susun kronologi sebab: angin berubah, obor diangkat, minyak mendorong sumbu terlepas, api membakar. Pilih sebab langsung.","19":"Cari alasan yang disebut langsung di paragraf ketiga, bukan alasan yang hanya mungkin.","20":"Cari tindakan sesaat setelah api menyala. Pilih yang disebut langsung (melepas seragam dan menyabet).","21":"Tentukan peran paragraf ketiga (niat dan keberangkatan) dan keempat (kejadian). Hubungannya adalah kelanjutan peristiwa.","22":"Nilai moral dinilai dari tindakan tokoh di akhir cerita (menyelamatkan dan berkorban).","23":"Prediksi harus logis dari alur. Tanyakan: tanpa ikut ke sawah, apa yang tidak terjadi?","24":"Soal pilih DUA. Cek tiap opsi ke teks; opsi yang bertentangan dengan peristiwa utama (siang hari, meninggalkan) salah.","25":"Nilai tiap pernyataan dengan menarik makna dari alur cerita, bukan sekadar mencari kata yang sama.","26":"Cari tindakan sahabat di paragraf terakhir (melepas seragam, menggendong, berlari).","27":"Cek tiap pernyataan ke teks. Perhatikan tokoh \"saya\" yang nekat meski dilarang Ayah.","28":"Cari kata itu di teks. Makna kata serapan/istilah biasanya dijelaskan lewat tanda kurung atau kalimat di sekitarnya. Pilih opsi yang menyebut <b>peran sekaligus konteksnya</b>, bukan yang hanya benar sebagian.","29":"Tentukan dulu ide pokoknya (gotong royong), lalu cari kalimat berisi <b>tindakan nyata</b> yang memperlihatkannya. Coret opsi tentang ritual spiritual dan opsi tentang masalah/tantangan.","30":"Tulis satu kata kunci untuk tiap paragraf (misalnya: nilai vs. masalah). Perhatikan penanda pergeseran seperti <i>Namun</i> dan <i>Meski demikian</i> yang menandai perubahan isi paragraf.","31":"Kesimpulan teks argumentasi biasanya diawali penanda seperti <i>Oleh karena itu</i>. Tanyakan: kalimat ini hanya merangkum masalah, atau menawarkan jalan keluar? Kata <i>misalnya</i> menandakan usulan yang konkret.","32":"Kaitkan kata itu dengan isi paragraf ketiga: orang lebih fokus pada ponsel daripada berkomunikasi langsung dengan orang di sekitarnya. Pilih opsi yang menyebut <b>sikap terhadap lawan bicara</b>, bukan sekadar kegiatan memakai ponsel.","33":"Ide pokoknya: ponsel pintar menggeser pola komunikasi. Cari kalimat yang menunjukkan <b>akibat nyata</b> pada cara berkomunikasi. Waspadai opsi yang bertentangan dengan teks (misalnya gen-Z menyukai ruang fisik) atau yang hanya mengulang ide pokok tanpa bukti.","34":"Ringkas paragraf tiga (persoalan: pola interaksi berubah) dan paragraf empat (faktor pemicu, ditandai <i>Pertama</i> dan <i>Kedua</i>). Tentukan arah hubungannya, lalu bedakan <b>memperkuat</b> (menambah bukti) dari <b>merinci</b> (menguraikan bagian).","35":"Kesimpulan harus mewakili <b>keseluruhan</b> isi teks dan sejalan dengan ajakan di paragraf terakhir. Coret opsi yang hanya mewakili sebagian isi atau menambah klaim baru yang tidak dibahas teks.","36":"Gagasan utama paragraf pertama ada pada kalimat awal; kalimat berikutnya menjabarkannya.","37":"Rumuskan arti literasi dari uraian paragraf kedua: berpikir kritis, memilah, memahami konteks.","38":"Baca dua kalimat paragraf kedua: yang pertama menegaskan, yang kedua menjelaskan.","39":"Soal mencari pernyataan yang tidak sesuai. Waspadai kata <i>hanya</i>; teks memakai kata <i>tidak hanya</i>.","40":"Judul dan ajakan <i>peningkatan literasi digital menjadi kebutuhan mendesak</i> menunjukkan tujuan mengajak.","41":"Soal pilih DUA. Verifikasi tiap opsi; opsi dengan kata <i>hanya</i> atau <i>tidak berhubungan</i> biasanya salah."},"MK":{"1":"gagasan","2":"kata","3":"isi","4":"isi","5":"tujuan","6":"paragraf","7":"isi","8":"kata","9":"isi","10":"simpulan","11":"isi","12":"isi","13":"isi","14":"isi","15":"isi","16":"latar","17":"watak","18":"konflik","19":"watak","20":"urutan","21":"paragraf","22":"amanat","23":"akhir","24":"isi","25":"isi","26":"isi","27":"amanat","28":"kata","29":"gagasan","30":"paragraf","31":"simpulan","32":"kata","33":"gagasan","34":"paragraf","35":"simpulan","36":"gagasan","37":"kata","38":"kalimat","39":"isi","40":"tujuan","41":"isi"},"NOM":{"TKA 2026 dan Integrasi AN":1,"Seragam":2,"Mappalili":3,"Interaksi Sosial di Era Digital":4,"Literasi Digital":5}},"B":{"D":[{"t":"Gerakan Bersih Sampah","k":"Nonfiksi · Berita","p":"<b>Gerakan Bersih Sampah: Kolaborasi Pemerintah dan Masyarakat Menuju Indonesia Bersih</b>\nKementerian Lingkungan Hidup/Badan Pengendalian Lingkungan Hidup (KLH/BPLH) bergerak cepat merespons instruksi Presiden Prabowo Subianto dalam Taklimat dan Rakornas 2026 melalui peluncuran Gerakan Bersih Sampah di Lingkungan Sekitar dan Kantor secara serentak di seluruh Indonesia.\nDi Jakarta, pimpinan dan ratusan staf KLH/BPLH memulai gerakan ini dengan menyisir lingkungan Kebon Nanas hingga bantaran Sungai Cipinang guna memastikan pembersihan sampah plastik dan anorganik dilakukan secara tuntas. Langkah strategis ini menandai kebangkitan kembali Program Bersih Nasional yang mengedepankan aksi rutin di lingkungan perkantoran, saluran air, dan badan sungai.\nSekretaris Kementerian LH/Sekretaris Utama BPLH, Rosa Vivien Ratnawati, menegaskan bahwa gerakan ini adalah wujud nyata komitmen pemerintah dalam menerjemahkan arahan Presiden ke dalam langkah konsisten dan berkelanjutan. “Bapak Presiden memiliki komitmen yang sangat besar terhadap pengurangan sampah, terutama sampah plastik. Arahan beliau jelas, bahwa upaya bersih-bersih harus menjadi gerakan bersama, dilakukan secara rutin, dan dimulai dari lingkungan terdekat, termasuk kantor-kantor pemerintah,” ujar Rosa Vivien.\nSebagai bentuk konsistensi terhadap perubahan budaya kerja, KLH/BPLH kini menetapkan Gerakan Bersih Sampah di Lingkungan Sekitar dan Kantor sebagai agenda wajib yang rencananya akan dilaksanakan tiga kali dalam sepekan. Pembersihan yang menyasar ekosistem vital seperti Sungai Cipinang menjadi krusial karena sungai sering kali menjadi titik kumpul sampah plastik sekali pakai yang berdampak buruk pada kualitas lingkungan hidup perkotaan.\nVivien menambahkan bahwa keberhasilan Program Bersih Nasional sangat bergantung pada pergeseran paradigma masyarakat dalam mengelola sampah dari sumbernya. Melalui penguatan kembali tradisi gotong royong dan kedisiplinan individu, diharapkan setiap warga negara memiliki kesadaran tinggi untuk melakukan pemilahan sampah secara mandiri. “Mulainya sederhana, pilah dan pilih sampah dari rumah dan kantor yang mana sampah plastik, mana sampah organik. Jika kebiasaan ini dilakukan secara konsisten, dampaknya akan sangat signifikan bagi lingkungan,” ujar Rosa Vivien.\nKeterlibatan masyarakat dalam kegiatan ini mendapat respons positif dari Komunitas Sungai Cipinang. Totok, salah satu anggota komunitas, menilai kegiatan bersih-bersih yang dilakukan bersama KLH/BPLH memberikan dampak langsung bagi lingkungan sekitar sungai. “Gerakan ini sangat bagus untuk menjaga lingkungan. Saya berharap ke depannya kegiatan seperti ini bisa terus dilestarikan dan semangatnya tetap dijaga,” kata Totok.\n<small><i>Sumber: Kementerian Lingkungan Hidup / Badan Pengendalian Lingkungan Hidup (kemenlh.go.id), 3 Februari 2026.</i></small>","q":[[1,"Tekstual – Gagasan Utama","Gagasan utama teks tersebut adalah …",["Peran Komunitas Sungai Cipinang dalam menjaga lingkungan","Peluncuran Gerakan Bersih Sampah oleh KLH/BPLH","Sejarah berdirinya KLH/BPLH","Perbandingan kebijakan lingkungan Indonesia dengan negara lain","Tugas Presiden Prabowo dalam pengelolaan sampah"],1,"Seluruh paragraf membahas peluncuran Gerakan Bersih Sampah oleh KLH/BPLH beserta tujuan dan responsnya."],[2,"Tekstual – Informasi Rinci","Menurut teks, Gerakan Bersih Sampah dilaksanakan berapa kali dalam sepekan?",["Satu kali","Dua kali","Tiga kali","Empat kali","Lima kali"],2,"Paragraf keempat: agenda wajib yang rencananya dilaksanakan tiga kali dalam sepekan."],[3,"Tekstual – Makna Kata","Makna istilah <i>paradigma</i> dalam teks tersebut adalah …",["Kebijakan pemerintah","Cara pandang atau pola pikir","Kegiatan rutin","Alat kebersihan","Lokasi pembersihan"],1,"\"Pergeseran paradigma masyarakat dalam mengelola sampah\" berarti perubahan cara pandang atau pola pikir."],[4,"Tekstual – Informasi Rinci","Lokasi yang menjadi sasaran pembersihan di Jakarta adalah …",["Pantai Ancol","Kebon Nanas hingga bantaran Sungai Cipinang","Monas dan sekitarnya","Taman Mini Indonesia Indah","Pelabuhan Tanjung Priok"],1,"Paragraf kedua menyebut lingkungan Kebon Nanas hingga bantaran Sungai Cipinang."],[5,"Inferensial – Tujuan Penulis","Tujuan penulis menyajikan teks tersebut adalah …",["Mengkritik kinerja KLH/BPLH","Menjelaskan peluncuran dan tujuan Gerakan Bersih Sampah","Mempromosikan produk pengelolaan sampah tertentu","Menolak kebijakan Presiden Prabowo","Membandingkan kebijakan Indonesia dengan negara maju"],1,"Teks berbentuk berita yang menginformasikan peluncuran serta tujuan gerakan."],[6,"Inferensial – Kesesuaian Isi","Pernyataan yang <b>SESUAI</b> dengan isi teks adalah …",["Gerakan Bersih Sampah hanya dilaksanakan di Jakarta","Presiden Prabowo menekankan pentingnya mobilisasi seluruh elemen negara","Masyarakat tidak dilibatkan dalam gerakan ini","Rosa Vivien menolak arahan Presiden","Sungai Cipinang bukan menjadi sasaran pembersihan"],1,"Opsi lain jelas bertentangan dengan teks. Arahan Presiden menekankan bahwa bersih-bersih menjadi gerakan bersama."],[7,"Inferensial – Hubungan Antarparagraf","Hubungan makna antara paragraf keempat dan kelima adalah …",["Paragraf keempat menjelaskan kebijakan, paragraf kelima menjelaskan harapan perubahan perilaku","Paragraf kelima menyangkal pernyataan paragraf keempat","Paragraf keempat dan kelima tidak berhubungan","Paragraf kelima adalah contoh dari paragraf keempat","Paragraf keempat adalah simpulan, paragraf kelima adalah pendahuluan"],0,"Paragraf keempat memuat kebijakan (agenda wajib tiga kali sepekan); paragraf kelima memuat harapan pergeseran paradigma dan pemilahan sampah."],[8,"Evaluasi – Nilai dalam Teks","Nilai yang paling menonjol dalam teks tersebut adalah …",["Kejujuran","Gotong royong dan kedisiplinan","Kekayaan","Kekuasaan","Individualisme"],1,"Teks menyebut penguatan tradisi gotong royong dan kedisiplinan individu."],[9,"Tekstual – Pilih Dua Pernyataan","Pilihlah <b>DUA</b> pernyataan yang benar berdasarkan teks tersebut!",["Gerakan Bersih Sampah merupakan tindak lanjut arahan Presiden Prabowo","KLH/BPLH hanya melibatkan pegawai internal tanpa masyarakat","Pembersihan menyasar Sungai Cipinang karena menjadi titik kumpul sampah plastik","Gerakan ini tidak akan dilaksanakan di wilayah lain selain Jakarta","Masyarakat menolak keterlibatan dalam gerakan ini"],{"m":[0,2]},"A: gerakan merespons instruksi Presiden. C: sungai menjadi titik kumpul sampah plastik sekali pakai. B, D, E bertentangan dengan teks."],[10,"Tekstual – Benar/Salah","Tentukan <b>Benar</b> atau <b>Salah</b> untuk setiap pernyataan berikut berdasarkan teks!",["Rosa Vivien Ratnawati adalah Sekretaris Kementerian LH.","Gerakan Bersih Sampah ditetapkan sebagai agenda wajib.","Komunitas Sungai Cipinang menolak kegiatan pembersihan."],[1,1,0],"1 Benar. 2 Benar (agenda wajib). 3 Salah: komunitas merespons positif.",["Benar","Salah"]],[11,"Inferensial – Sesuai/Tidak Sesuai","Tentukan <b>Sesuai</b> atau <b>Tidak Sesuai</b> untuk pernyataan tentang tujuan Gerakan Bersih Sampah berdasarkan teks!",["Membangun disiplin internal di lingkungan pemerintahan.","Memberikan contoh langsung kepada masyarakat.","Meningkatkan penggunaan plastik sekali pakai."],[1,1,0],"Gerakan dimulai dari kantor pemerintah (disiplin internal) sekaligus menjadi contoh bagi warga. Pernyataan ketiga berlawanan dengan tujuan mengurangi sampah plastik.",["Sesuai","Tidak Sesuai"]],[12,"Tekstual – Pilih Dua Pernyataan","Pilihlah <b>DUA</b> pernyataan yang sesuai dengan peran Presiden Prabowo dalam teks!",["Menekankan pentingnya mobilisasi seluruh elemen negara","Menginstruksikan gerakan bersih-bersih menjadi gerakan bersama","Melarang pelaksanaan Gerakan Bersih Sampah","Tidak peduli terhadap pengurangan sampah plastik","Hanya melibatkan TNI dan Polri tanpa masyarakat"],{"m":[0,1]},"Presiden memberi arahan agar bersih-bersih menjadi gerakan bersama dan rutin; C, D, E bertentangan dengan teks."],[13,"Tekstual – Benar/Salah","Tentukan <b>Benar</b> atau <b>Salah</b> untuk pernyataan tentang peran masyarakat berdasarkan teks!",["Keberhasilan Program Bersih Nasional bergantung pada pergeseran paradigma masyarakat.","Pemilahan sampah dari sumbernya dianjurkan oleh Rosa Vivien.","Masyarakat tidak perlu terlibat dalam pengelolaan sampah."],[1,1,0],"1 dan 2 tertulis di paragraf kelima. 3 Salah: gerakan menuntut keterlibatan warga.",["Benar","Salah"]],[14,"Tekstual – Pilih Dua Pernyataan","Pilihlah <b>DUA</b> pernyataan yang benar tentang respons Komunitas Sungai Cipinang!",["Totok menilai kegiatan bersih-bersih memberikan dampak langsung","Komunitas menolak kerja sama dengan KLH/BPLH","Totok berharap kegiatan ini terus dilestarikan","Komunitas tidak peduli dengan kebersihan sungai","Komunitas hanya menonton tanpa terlibat"],{"m":[0,2]},"Paragraf terakhir: Totok menilai kegiatan berdampak langsung dan berharap terus dilestarikan."],[15,"Tekstual – Sesuai/Tidak Sesuai","Tentukan <b>Sesuai</b> atau <b>Tidak Sesuai</b> untuk pernyataan tentang pelaksanaan Gerakan Bersih Sampah!",["Dilaksanakan secara serentak di seluruh Indonesia.","Hanya menyasar lingkungan perkantoran saja.","Menyasar saluran air dan badan sungai."],[1,0,1],"1 Sesuai (serentak). 2 Tidak sesuai: juga menyasar lingkungan sekitar, saluran air, dan sungai. 3 Sesuai.",["Sesuai","Tidak Sesuai"]]]},{"t":"Perahu Kertas","k":"Fiksi · Cerpen","p":"<b>Perahu Kertas</b>\n\"Bu, aku ingin sekolah lagi,\" lirih Alif sambil menatap ibunya yang sedang menumbuk jagung. Ibu hanya diam, tangannya yang keras dan berkerut terus menumbuk. Alif tahu, biaya sekolah bukan perkara mudah. Ayahnya telah pergi sejak dua tahun lalu, dan ibu harus menghidupi tiga anaknya sendirian.\nMalam itu, Alif melipat selembar kertas menjadi perahu. Ia menuliskan mimpinya di atas kertas itu: \"Aku ingin menjadi guru.\" Lalu ia menghanyutkan perahu kertas itu ke sungai kecil di belakang rumah. \"Bawa mimpiku, Nak,\" bisiknya.\nKeesokan harinya, Alif melihat perahu kertasnya kembali terdampar di tepi sungai, basah dan robek. Ia memungutnya, lalu membakarnya. \"Mimpi itu terlalu jauh,\" gumamnya. Namun, saat ia berbalik, ibunya berdiri di belakangnya. \"Jangan bakar mimpimu, Alif. Ibu akan berusaha,\" kata ibunya sambil memeluknya erat.","q":[[16,"Tekstual – Unsur Intrinsik","Berdasarkan teks tersebut, bagaimana sifat yang dimiliki Alif?",["Pemurung dan mudah menyerah","Penuh harap dan gigih","Pendiam dan penakut","Pemalas dan tidak peduli","Ceria dan banyak bicara"],1,"Alif tetap berharap bisa sekolah dan gigih meskipun keadaan sulit."],[17,"Inferensial – Penyebab Konflik","Apa yang menyebabkan Alif merasa ragu untuk melanjutkan sekolah?",["Ia tidak memiliki seragam sekolah.","Ia harus membantu ibunya menumbuk jagung.","Ayahnya telah meninggal dan biaya sekolah menjadi beban.","Ia tidak memiliki teman di sekolah.","Perahu kertasnya hanyut terbawa sungai."],2,"Menurut kunci: ayah telah tiada dan biaya sekolah menjadi beban keluarga. (Catatan: teks menulis \"telah pergi\".)"],[18,"Inferensial – Prediksi Akhir Cerita","Bagaimana kisah yang sesuai untuk menutup cerita agar Alif merasa lega?",["Alif membakar perahu kertasnya dan berhenti bermimpi.","Ibu menjual perhiasan untuk membayar sekolah Alif.","Alif memutuskan untuk bekerja di sawah tetangga.","Alif pergi dari rumah karena malu kepada ibunya.","Ibu menyuruh Alif untuk menunggu sampai ia dewasa."],1,"Ibu berusaha membayar sekolah Alif sehingga mimpinya tercapai dan ia lega."],[19,"Evaluasi – Respons Emosional","Bagaimana reaksi yang ditunjukkan oleh Ibu ketika melihat Alif membakar perahu kertasnya?",["Marah dan memarahi Alif.","Diam saja dan membiarkan Alif.","Menangis dan memohon Alif berhenti.","Memeluk Alif dan meyakinkannya untuk tetap bermimpi.","Menyuruh Alif untuk melupakan mimpinya."],3,"Ibu memeluk Alif dan meyakinkannya tetap bermimpi — tanda kasih sayang dan dukungan."]]},{"t":"BI Prediksi Ekonomi 2026","k":"Nonfiksi · Berita","p":"<b>BI Prediksi Ekonomi Indonesia Tumbuh 4,9–5,7 Persen di 2026</b>\nBank Indonesia (BI) memperkirakan pertumbuhan ekonomi Indonesia pada tahun 2026 berada dalam kisaran 4,9–5,7 persen. Gubernur BI Perry Warjiyo mengatakan pertumbuhan ekonomi meningkat dari 5,39 persen (yoy) pada triwulan IV 2025 menjadi 5,61 persen (yoy) pada triwulan I 2026, ditopang oleh permintaan domestik.\n“Konsumsi rumah tangga meningkat didorong kenaikan mobilitas masyarakat pada periode Hari Besar Keagamaan Nasional (HBKN) dan dampak positif berbagai stimulus Pemerintah,” kata Perry saat konferensi pers hasil RDG.\nKonsumsi pemerintah tumbuh tinggi didorong belanja program prioritas Pemerintah, terutama Makan Bergizi Gratis (MBG), serta peningkatan belanja pegawai melalui gaji ke-14 atau Tunjangan Hari Raya (THR). Investasi khususnya investasi bangunan meningkat dipengaruhi oleh Program Kerja Prioritas Nasional (PKPN). Sementara itu, ekspor turun dipengaruhi oleh pertumbuhan ekonomi global yang melambat.\n“Ke depan, pertumbuhan ekonomi diprakirakan tetap baik ditopang oleh optimalisasi belanja Pemerintah yang bersinergi dengan bauran kebijakan BI termasuk pelonggaran kebijakan makroprudensial dan kebijakan sistem pembayaran untuk turut mendukung kegiatan ekonomi digital dan keuangan inklusif,” tuturnya.\nBank Indonesia terus memperkuat bauran kebijakan melalui kebijakan moneter, makroprudensial, dan sistem pembayaran, yang bersinergi dengan kebijakan pemerintah untuk menjaga stabilitas dengan tetap mendukung pertumbuhan ekonomi.\n<small><i>Sumber: Disadur dari IDX Channel dan ANTARA News, Mei 2026.</i></small>","q":[[20,"Tekstual – Informasi Rinci","Menurut teks tersebut, berapa kisaran pertumbuhan ekonomi Indonesia 2026?",["3,5–4,5 persen","4,9–5,7 persen","5,0–6,0 persen","6,0–7,0 persen","2,5–3,5 persen"],1,"Kalimat pertama: BI memperkirakan pertumbuhan ekonomi 2026 berada pada kisaran 4,9–5,7 persen."],[21,"Tekstual – Makna Kata","Makna istilah <i>stimulus</i> dalam teks tersebut adalah …",["Penghambat pertumbuhan ekonomi","Rangsangan atau dorongan untuk meningkatkan aktivitas ekonomi","Penurunan belanja pemerintah","Kenaikan harga barang","Pengurangan tenaga kerja"],1,"Konteksnya \"dampak positif berbagai stimulus Pemerintah\", jadi <i>stimulus</i> berarti rangsangan atau dorongan."],[22,"Tekstual – Informasi Rinci","Berapa pertumbuhan ekonomi triwulan I 2026 menurut teks?",["4,9 persen","5,39 persen","5,61 persen","5,7 persen","6,0 persen"],2,"5,39 persen adalah triwulan IV 2025; triwulan I 2026 sebesar 5,61 persen (yoy)."],[23,"Tekstual – Informasi Rinci","Program prioritas pemerintah yang disebutkan dalam teks adalah …",["Kartu Prakerja","Makan Bergizi Gratis (MBG)","Bantuan Langsung Tunai","Subsidi BBM","Program Indonesia Pintar"],1,"Konsumsi pemerintah didorong belanja program prioritas, terutama Makan Bergizi Gratis (MBG)."],[24,"Inferensial – Faktor Penopang","Faktor yang menopang pertumbuhan ekonomi triwulan I 2026 adalah …",["Ekspor yang meningkat tajam","Permintaan domestik dan konsumsi rumah tangga","Penurunan belanja pemerintah","Melemahnya nilai tukar Rupiah","Berkurangnya investasi"],1,"Pertumbuhan \"ditopang oleh permintaan domestik\", antara lain konsumsi rumah tangga yang meningkat."],[25,"Inferensial – Kesesuaian Isi","Pernyataan yang <b>SESUAI</b> dengan isi teks adalah …",["Ekspor meningkat pesat pada triwulan I 2026","Investasi bangunan menurun drastis","Konsumsi pemerintah tumbuh tinggi didorong belanja program prioritas","BI tidak menggunakan kebijakan makroprudensial","Pertumbuhan ekonomi 2026 diprediksi di bawah 4 persen"],2,"Hanya opsi C yang sesuai paragraf ketiga. Ekspor turun, investasi bangunan naik, BI memakai makroprudensial, dan proyeksi 4,9–5,7 persen."],[26,"Inferensial – Hubungan Antarparagraf","Hubungan makna antara paragraf ketiga dan keempat adalah …",["Paragraf ketiga menjelaskan faktor pendorong, paragraf keempat menjelaskan prospek ke depan","Paragraf keempat menyangkal pernyataan paragraf ketiga","Paragraf ketiga dan keempat tidak berhubungan","Paragraf keempat adalah contoh dari paragraf ketiga","Paragraf ketiga adalah simpulan, paragraf keempat adalah pendahuluan"],0,"Paragraf ketiga memaparkan faktor-faktor pendorong saat ini; paragraf keempat dibuka dengan \"Ke depan\" sehingga membahas prospek."],[27,"Evaluasi – Pilihan Kata","Mengapa penulis memilih istilah <i>bauran kebijakan</i> dalam teks tersebut?",["Untuk menunjukkan bahwa BI hanya menggunakan satu kebijakan","Untuk menekankan kombinasi berbagai kebijakan yang saling mendukung","Untuk memberikan kesan informal","Untuk menyiratkan adanya konflik antarlembaga","Untuk menunjukkan ketidakpastian kebijakan"],1,"<i>Bauran</i> berarti campuran. Teks menyebut gabungan kebijakan moneter, makroprudensial, dan sistem pembayaran yang bersinergi."],[28,"Tekstual – Pilih Dua Pernyataan","Pilihlah <b>DUA</b> pernyataan yang benar berdasarkan teks tersebut!",["Pertumbuhan ekonomi triwulan I 2026 mencapai 5,61 persen","Konsumsi rumah tangga menurun pada triwulan I 2026","Program MBG menjadi salah satu pendorong konsumsi pemerintah","Ekspor meningkat pesat pada triwulan I 2026","BI tidak memperkuat bauran kebijakan"],{"m":[0,2]},"A dan C tertulis di teks. B, D, dan E bertentangan (konsumsi rumah tangga naik, ekspor turun, BI memperkuat bauran kebijakan)."],[29,"Tekstual – Benar/Salah","Tentukan <b>Benar</b> atau <b>Salah</b> untuk pernyataan tentang faktor pendorong ekonomi berdasarkan teks!",["Konsumsi rumah tangga meningkat pada triwulan I 2026.","Investasi bangunan menurun karena PKPN.","Ekspor turun dipengaruhi perlambatan ekonomi global."],[1,0,1],"1 Benar. 2 Salah: investasi bangunan justru meningkat dipengaruhi PKPN. 3 Benar.",["Benar","Salah"]],[30,"Tekstual – Sesuai/Tidak Sesuai","Tentukan <b>Sesuai</b> atau <b>Tidak Sesuai</b> untuk pernyataan tentang kebijakan BI berdasarkan teks!",["BI memperkuat kebijakan moneter, makroprudensial, dan sistem pembayaran.","BI bertujuan menghambat pertumbuhan ekonomi.","Bauran kebijakan BI bersinergi dengan kebijakan pemerintah."],[1,0,1],"1 dan 3 tertulis di paragraf terakhir. 2 tidak sesuai: BI menjaga stabilitas dengan tetap mendukung pertumbuhan.",["Sesuai","Tidak Sesuai"]],[31,"Tekstual – Pilih Dua Pernyataan","Pilihlah <b>DUA</b> pernyataan yang benar tentang konsumsi pemerintah berdasarkan teks!",["Didorong oleh belanja program prioritas MBG","Didorong oleh peningkatan belanja pegawai melalui THR","Konsumsi pemerintah menurun pada triwulan I 2026","Tidak ada kenaikan belanja pegawai","Konsumsi pemerintah tidak berpengaruh pada ekonomi"],{"m":[0,1]},"Konsumsi pemerintah tumbuh tinggi karena belanja program prioritas (MBG) dan peningkatan belanja pegawai (gaji ke-14/THR)."]]},{"t":"Roh Meratus","k":"Fiksi · Cerpen","p":"<b>Roh Meratus</b> <small>(Zaidinoor)</small>\nKami kembali berjalan pulang. Kondisiku sudah sepenuhnya normal. Tetua melangkah di depanku. Tak kusangka, dalam keadaan kritis ternyata kami telah sangat jauh memasuki belantara. Aku memperhatikan pohon-pohon besar yang kami lewati. Sinar matahari bahkan hampir tak bisa menembus ke bawah.\nAku merasa asing di tempat ini. Pohon-pohon yang berlumut itu, sulur-sulur yang bergantungan, semak-semak yang rimbun. Oh... ternyata belantara ini adalah tempat menakjubkan. Bayangkan, di lumut batang pohon itu udang-udang kecil berloncatan lincah. Belum pernah aku melihat udang hidup di batang pohon!\n\"Kau tahu anak muda, tempat ini merasa terancam dengan keberadaan...\" tetua menghentikan langkahnya dan mengambil sesuatu dalam butah. \"Roh Meratus meniupkan wisa ke tubuh kalian, sayang kawan-kawanmu yang lain terlambat,\" sambungnya kemudian melemparkan gulungan kertas yang diambil dari butah. Sigap kutangkap gulungan itu.\n\"Itu peta yang kuambil dari ranselmu. Ternyata kalian memasang patok-patok dan memberi tanda pohon-pohon besar untuk ditebang. Dan perlu kau ketahui anak muda, tempat ini juga termasuk wilayah yang akan kalian pasangi patok-patok itu,\" katanya dingin.\nPerlahan kubuka gulungan peta di tanganku. Dari peta terlihat jelas, pekerjaan kami tinggal sedikit lagi. Jika saja semuanya lancar, maka kami akan sampai di tempat ini dan selesailah kontrak kerja kami. Dalam waktu singkat, mungkin alat-alat berat akan didatangkan! Pohon-pohon ini, sulur-sulur ini, lumut-lumut ini, udang-udang ini... akan bagaimana? \"Tetua, izinkan aku tinggal di sini dan bersama kaummu menjaga tempat ini...\" Akhirnya setelah lama hanya diam, aku menatap mata tetua mantap.\n<small><i>Glosarium: Butah = wadah anyaman rotan; Wisa = bisa atau racun.</i></small>","q":[[32,"Tekstual – Latar Tempat","Latar tempat yang tergambar dalam cerita tersebut adalah ...",["Sebuah perkampungan penduduk adat.","Daerah perkotaan yang ramai.","Pegunungan batu yang tandus.","Hutan belantara yang lebat.","Pantai dengan pasir putih."],3,"Pohon besar, sulur, lumut, dan sinar matahari yang sulit menembus menggambarkan hutan belantara yang lebat."],[33,"Inferensial – Penyebab Konflik","Apa yang menyebabkan konflik dalam kutipan cerpen tersebut?",["Tokoh utama dan kawan-kawan tersesat di hutan.","Kawan-kawan tokoh utama mengalami hal buruk karena wisa.","Tetua menemukan peta dari ransel tokoh utama.","Ketua adat tidak menyukai kehadiran orang luar.","Kelompok tokoh utama dianggap mengancam kelestarian hutan."],4,"Kelompok tokoh utama memasang patok dan menandai pohon untuk ditebang, sehingga dianggap mengancam hutan."],[34,"Inferensial – Prediksi Tindakan","Apa yang akan dilakukan tokoh utama setelah mengalami peristiwa tersebut?",["Meninggalkan pekerjaannya dan bergabung dengan tetua untuk melindungi hutan.","Menyelesaikan proyek sesuai rencana agar kontrak kerja tidak batal.","Meninggalkan hutan tanpa memberi tahu tetua.","Menyampaikan laporan kepada perusahaan untuk mempercepat alat berat.","Mencari orang pintar untuk mengusir Roh Meratus."],0,"Ia meminta izin tinggal dan menjaga hutan bersama kaum tetua."],[35,"Evaluasi – Kesesuaian Karakter (Benar/Salah)","Perubahan sikap tokoh utama ditunjukkan melalui tindakannya di akhir kutipan. Tentukan Benar atau Salah untuk setiap pernyataan.",["Tindakan tokoh utama sesuai karena ia menunjukkan kepedulian terhadap kelestarian hutan.","Tindakan tokoh utama tidak sesuai karena ia telah meninggalkan kewajiban kontrak kerja.","Tindakan tokoh utama sesuai karena ia ingin membuktikan mampu memimpin proyek."],[1,0,0],"Hanya pernyataan 1 yang sesuai dengan isi teks; pernyataan 2 dan 3 tidak."]]},{"t":"Sampah Digital","k":"Nonfiksi · Opini","p":"<b>Sampah Digital: Jejak Karbon yang Tak Terlihat</b>\nDi era digital, kita sering merasa telah berkontribusi pada kelestarian lingkungan dengan mengurangi penggunaan kertas. Namun, tahukah Anda bahwa setiap email, unggahan media sosial, dan pencarian di internet menyimpan jejak karbon? Data center yang menyimpan semua informasi digital kita membutuhkan energi listrik yang sangat besar. Menurut sebuah studi, industri teknologi informasi menyumbang sekitar 2% dari emisi karbon global, setara dengan industri penerbangan.\nSampah digital tidak hanya soal energi. Perangkat elektronik yang cepat usang, seperti ponsel dan laptop, menjadi limbah elektronik (e-waste) yang sulit terurai. Setiap tahun, dunia menghasilkan lebih dari 50 juta ton e-waste, dan hanya sekitar 20% yang didaur ulang dengan benar. Sisanya berakhir di tempat pembuangan akhir, mencemari tanah dan air.\nIronisnya, kesadaran akan sampah digital masih sangat rendah. Banyak orang merasa cukup dengan tidak membuang sampah plastik, tetapi lupa bahwa perilaku digital mereka juga berdampak. Oleh karena itu, perlu ada edukasi tentang \"diet digital\", yaitu mengurangi konsumsi data yang tidak perlu, menghapus email lama, dan memperpanjang usia perangkat elektronik.","q":[[36,"Tekstual – Urutan Informasi","Manakah urutan berikut yang paling sesuai dengan isi teks?",["Penggunaan kertas berkurang → data center boros energi → e-waste menumpuk.","Data center boros energi → e-waste menumpuk → kesadaran rendah.","E-waste menumpuk → data center boros energi → diet digital.","Kesadaran rendah → data center boros energi → e-waste menumpuk.","Diet digital → e-waste menumpuk → data center boros energi."],1,"Urutan dalam teks: data center boros energi → e-waste menumpuk → kesadaran rendah."],[37,"Inferensial – Pesan Moral","Apa pesan moral yang disiratkan melalui teks tersebut?",["Sampah digital tidak berbahaya bagi lingkungan.","Penggunaan internet harus dihentikan sepenuhnya.","Kesadaran lingkungan harus mencakup perilaku digital kita.","Pemerintah bertanggung jawab penuh atas sampah digital.","E-waste adalah satu-satunya masalah lingkungan saat ini."],2,"Teks menyindir orang yang peduli sampah plastik tetapi lupa dampak perilaku digital."],[38,"Evaluasi – Relevansi dengan Kehidupan","Manakah relevansi paling kuat antara sindiran dalam teks dengan realitas kehidupan sehari-hari?",["Kritik terhadap kampanye lingkungan yang hanya fokus pada sampah plastik.","Sindiran bagi pengguna internet yang tidak menghapus email lama.","Penggambaran data center yang boros energi.","Keadaan masyarakat yang belum peduli pada sampah digital.","Kontras antara kesadaran lingkungan fisik dan digital."],4,"Relevansi paling kuat: kontras antara kesadaran lingkungan fisik dan digital."]]},{"t":"Layur, Teruslah Berlayar","k":"Fiksi · Cerpen","p":"<b>Layur, Teruslah Berlayar</b> <small>(Anang YB)</small>\n\"Bapak, pulanglah,\" lirih Layur berharap. Ini hari keenam. Tiga hari adalah waktu terlama nelayan berada di laut. Dengan susah payah, Layur berpindah duduk ke dalam sebuah perahu tua. Penyangga kedua kaki Layur yang tak utuh ia letakkan di sampingnya.\n\"Jangan-jangan...\"\n\"Tidak ... Aku tidak boleh berpikiran buruk. Bapak pasti pulang dengan selamat. Aku akan tetap menunggunya di sini sambil berdoa.\"\nLayur masih ingat masa-masa dulu, ketika Bapak berlayar pada malam hari dan keesokan harinya sudah merapat kembali di pantai dengan membawa ikan berlimpah.\n\"Ayo! Siapa mau udang?\" panggil Bapak. Layur berlari kencang bersama teman-temannya. Namun, itu adalah kenangan sepuluh tahun silam. Kini, udang dan ikan kecil adalah anugerah besar. Itu pun harus dijaring di tengah laut.\nLayur ingat betul, Bapak adalah pembuat bondet paling disegani, juga berpengaruh di dusun. Setiap hari, nelayan silih berganti datang ke rumah memesan bondet. Hasil panen ikan berlimpah. Tinggal melemparkan bondet ke dalam laut dan ... bum! Berkuntil-kuntil ikan terapung tinggal diserok menggunakan jaring.\nSampai suatu ketika ...\nDUAAAR!\nSeparuh rumah Layur luluh lantak karena simpanan bondet di gudang meledak. Ledakan bondet di gudang tak hanya merusak rumah tetapi juga mencelakai anak semata wayang. Ia berteriak minta tolong, menepuk-nepuk dadanya, dan menangis. Itulah titik balik yang amat disesali Bapak. Sejak itu, Bapak meninggalkan usaha pembuatan bondet. Demikian pula dengan warga Dusun Prau tempat mereka berdiam berangsur-angsur meninggalkan cara menangkap ikan dengan bondet.\nLamat-lamat terlihat kibaran layar bercorak biru. Layur beringsut menuruni perahu tempatnya duduk. Lambaian tangan bapaknya semakin jelas dan semakin dekat.\n\"Bapak dari mana? Bapak sudah tiga hari telat pulang!\" Seru Layur kesal. Matanya berkaca-kaca, menahan rindu, dan cemas.\n<small><i>Daftar istilah: Bondet = istilah lokal yang merujuk pada bahan peledak rakitan, sering disebut juga bom ikan.</i></small>","q":[[39,"Tekstual – Unsur Intrinsik","Berdasarkan teks tersebut, bagaimana sifat yang dimiliki oleh Layur?",["Nekat dan optimis.","Mudah cemas dan tabah.","Penuh harap dan kasih sayang.","Suka menyendiri dan tegas.","Cepat panik dan menyalahkan keadaan."],2,"Layur berharap Bapak pulang dengan selamat, berdoa, dan menahan rindu: penuh harap dan kasih sayang."],[40,"Inferensial – Penyebab Konflik","Apa yang menyebabkan Layur kesal kepada Bapak?",["Tidak pamit kepada Layur saat hendak berlayar.","Tidak membawa banyak ikan dari laut.","Tidak setuju Layur menunggu terlalu lama di pantai.","Tidak kunjung pulang setelah enam hari melaut.","Tidak menepati janjinya untuk pulang tepat waktu ketika melaut."],3,"Layur kesal karena Bapak tidak kunjung pulang setelah enam hari melaut."],[41,"Inferensial – Prediksi Akhir Cerita","Bagaimana kisah yang sesuai untuk menutup cerita agar Layur merasa lega pada cerita tersebut?",["Bapak meminta maaf pada Layur dan menceritakan penyebabnya pulang terlambat.","Bapak membimbing Layur pulang dan berjanji untuk tidak pulang terlambat lagi.","Bapak memeluk Layur dan merasa senang karena akhirnya ia bisa bertemu putrinya kembali.","Layur membereskan sampan dan memberikan hasil tangkapan yang tidak seberapa kepada Bapak.","Layur berterima kasih kepada Bapak karena telah menunggunya pulang dari melaut berhari-hari."],0,"Penjelasan Bapak tentang penyebab keterlambatannya menjawab kecemasan Layur sehingga ia lega."],[42,"Evaluasi – Respons Emosional","Bagaimana reaksi yang ditunjukkan oleh Bapak ketika rumahnya luluh lantak dan bondet buatannya melukai Layur?",["Merasa trauma dan membutuhkan waktu untuk menyendiri.","Menunjukkan respons yang biasa seperti tidak terjadi apa-apa.","Sangat terkejut dan sungguh menyesal atas apa yang dilakukan.","Marah terhadap orang lain dan merasa panik yang luar biasa.","Bingung dan berusaha mencerna terhadap apa yang telah terjadi."],2,"Peristiwa itu disebut titik balik yang amat disesali Bapak; ia pun berhenti membuat bondet."]]}],"TIPS":{"1":"Gagasan utama teks berita ada di kalimat awal (apa, siapa). Pilih yang mencakup seluruh teks.","2":"Cari angka dan satuan waktu di teks (<i>sepekan</i>). Perhatikan kata <i>rencananya</i>.","3":"Lihat konteks: <i>pergeseran paradigma masyarakat</i> berarti perubahan apa pada masyarakat? Pilih padanan maknanya.","4":"Cari nama lokasi di paragraf kedua. Hati-hati opsi lokasi terkenal lain yang tidak disebut.","5":"Teks berita bertujuan menginformasikan. Coret opsi yang bernada kritik, promosi, atau penolakan.","6":"Pilih pernyataan yang tidak bertentangan dengan isi teks. Coret opsi memuat <i>hanya</i>, <i>tidak</i>, atau <i>menolak</i>.","7":"Ringkas paragraf keempat (kebijakan) dan kelima (harapan perubahan perilaku), lalu tentukan hubungannya.","8":"Nilai dapat dilihat dari kata-kata positif yang diulang di teks (<i>gotong royong</i>, <i>kedisiplinan</i>).","9":"Soal pilih DUA. Verifikasi tiap opsi ke teks; opsi negatif seperti <i>menolak</i> atau <i>tidak melibatkan</i> biasanya salah.","10":"Cocokkan tiap pernyataan dengan jabatan, status agenda, dan respons komunitas di teks.","11":"Tujuan bisa tersirat: gerakan dimulai dari kantor pemerintah dan diharapkan menjadi contoh. Pernyataan yang berlawanan dengan tujuan itu salah.","12":"Pilih dua pernyataan positif yang selaras dengan arahan Presiden tentang gerakan bersama. Coret yang melarang atau tidak peduli.","13":"Cek tiap pernyataan di paragraf kelima. Pernyataan bahwa masyarakat tidak perlu terlibat bertentangan dengan seluruh teks.","14":"Fokus pada paragraf terakhir: apa yang dinilai dan diharapkan Totok.","15":"Cari kata <i>serentak</i>, <i>agenda</i>, dan sasaran lokasi di paragraf pertama dan kedua; waspadai kata <i>hanya</i>.","16":"Nilai sifat tokoh dari <b>ucapan dan tindakannya</b>, bukan dari suasana sedih cerita. Hindari opsi yang ekstrem atau bertentangan dengan perbuatan tokoh di akhir cerita.","17":"Cari alasan yang disebut jelas di paragraf pertama dan bedakan penyebab dari sekadar latar. Pilih opsi yang memuat <b>dua unsur</b>: keadaan ayah dan biaya sekolah. Bandingkan pilihan kata opsi dengan teks (teks menulis ayah <i>telah pergi</i>).","18":"Pilih akhir yang selaras dengan perkembangan konflik dan ucapan Ibu di akhir teks (<i>Ibu akan berusaha</i>). Coret opsi yang membuat Alif makin putus asa atau bertentangan dengan harapan tokoh.","19":"Cari <b>kutipan dan gerakan Ibu</b> tepat setelah Alif membakar perahu kertas. Pilih opsi yang memuat tindakan sekaligus pesan yang Ibu sampaikan.","20":"Cari angka kisaran di kalimat pertama; hati-hati dengan angka triwulan.","21":"Lihat konteks <i>dampak positif berbagai stimulus</i>. Pilih arti yang bernada mendorong.","22":"Bedakan triwulan IV 2025 (5,39) dan triwulan I 2026 (5,61).","23":"Cari singkatan di kurung. Program yang disebut: MBG.","24":"Cari kata <i>ditopang oleh</i> di kalimat pertama paragraf pertama.","25":"Cek tiap opsi ke paragraf ketiga. Perhatikan arah naik/turun tiap komponen (konsumsi, investasi, ekspor).","26":"Paragraf ketiga memuat faktor kondisi saat ini; paragraf keempat dibuka kata <i>Ke depan</i>.","27":"Tanyakan fungsi istilah: <i>bauran</i> berarti campuran, mengacu pada gabungan kebijakan.","28":"Soal pilih DUA. Cek angka dan arah naik/turun tiap pernyataan.","29":"Cek tiap pernyataan: perhatikan arah perubahan (meningkat/turun) pada tiap komponen.","30":"Pernyataan yang bertentangan dengan tujuan BI (menjaga stabilitas dan mendukung pertumbuhan) tidak sesuai.","31":"Cari dua faktor yang disebut mendorong konsumsi pemerintah di paragraf ketiga.","32":"Kumpulkan kata petunjuk suasana tempat: pohon besar, sulur, lumut, sinar matahari sulit menembus. Cocokkan kumpulan petunjuk itu dengan opsi, lalu coret opsi yang tidak punya petunjuk di teks.","33":"Bedakan konflik (apa yang membuat tetua bersikap dingin) dari peristiwa lain. Perhatikan isi peta dan apa yang dilakukan kelompok tokoh utama terhadap pohon-pohon di hutan.","34":"Baca kalimat terakhir cerpen: ucapan tokoh utama kepada tetua. Prediksi harus melanjutkan arah perubahan sikapnya, bukan berbalik arah.","35":"Nilai <b>setiap pernyataan sendiri-sendiri</b>. Untuk tiap pernyataan, cek dua hal: apakah kesimpulannya (sesuai/tidak sesuai) cocok dengan tindakan di akhir cerita, dan apakah alasan setelah kata <i>karena</i> benar-benar ada di teks.","36":"Tandai urutan topik per paragraf (energi, e-waste, kesadaran). Kerjakan dengan eliminasi: coret opsi yang urutannya terbalik atau memuat hal yang tidak muncul sebagai kejadian dalam teks.","37":"Pesan tersirat adalah inti sindiran penulis. Baca paragraf terakhir (kata <i>Ironisnya</i> dan <i>Oleh karena itu</i>). Coret opsi yang ekstrem seperti <i>sepenuhnya</i> atau <i>satu-satunya</i>.","38":"Cari kata penanda kontras atau ironi dalam teks (<i>Ironisnya</i>). Pilih opsi yang menangkap <b>pertentangan dua hal</b>, bukan yang hanya membahas salah satu sisi.","39":"Lihat dialog dan batin Layur: ia berharap, berdoa, menolak berpikir buruk, lalu kesal karena rindu dan cemas. Pilih sifat yang cocok dengan keseluruhan sikap itu dan coret sifat negatif yang ekstrem.","40":"Baca kalimat kekesalan Layur di bagian akhir dan cermati keterangan waktu dalam teks. Pilih alasan yang <b>disebut langsung</b> di cerita, bukan yang hanya mungkin.","41":"Kecemasan Layur muncul karena Bapak lama tidak pulang. Akhir yang membuatnya lega harus menjawab kecemasan itu. Coret opsi yang memuat detail tanpa dasar di teks.","42":"Fokus pada momen ledakan, lalu pada kalimat sesudahnya tentang perasaan Bapak dan tindakannya berhenti membuat bondet. Pilih opsi yang memuat dua perasaan itu sekaligus."},"MK":{"1":"gagasan","2":"isi","3":"kata","4":"isi","5":"tujuan","6":"isi","7":"paragraf","8":"amanat","9":"isi","10":"isi","11":"isi","12":"isi","13":"isi","14":"isi","15":"isi","16":"watak","17":"konflik","18":"akhir","19":"emosi","20":"isi","21":"kata","22":"isi","23":"isi","24":"isi","25":"isi","26":"paragraf","27":"bahasa","28":"isi","29":"isi","30":"isi","31":"isi","32":"latar","33":"konflik","34":"akhir","35":"karakter","36":"urutan","37":"amanat","38":"sindiran","39":"watak","40":"konflik","41":"akhir","42":"emosi"},"NOM":{"Gerakan Bersih Sampah":1,"Perahu Kertas":2,"BI Prediksi Ekonomi 2026":3,"Roh Meratus":4,"Sampah Digital":5,"Layur, Teruslah Berlayar":6}}};

const MAT={
kata:['Makna kata dan istilah dalam konteks',`Makna kata ditentukan dari <b>konteks kalimat</b>, bukan tebakan. Teks sering memberi petunjuk: padanan dalam tanda kurung, penjelasan setelah tanda hubung atau koma, serta contoh. Istilah khusus (misalnya <i>integrasi</i> atau <i>paradigma</i>) biasanya dapat dipahami dari kalimat di sekitarnya. Jawaban terbaik memuat <b>seluruh unsur makna</b> (siapa/apa dan fungsinya).`],
gagasan:['Ide pokok dan gagasan pendukung',`<b>Ide pokok</b> adalah inti yang dibahas dalam satu paragraf atau seluruh teks. <b>Gagasan pendukung</b> berupa rincian, contoh, data, atau bukti yang memperkuat ide pokok. Ujinya: kalimat itu menjawab pertanyaan ‘apa buktinya?’ terhadap ide pokok. Kalimat tentang hal lain, seperti masalah atau latar, bukan gagasan pendukung.`],
paragraf:['Hubungan antarparagraf',`Paragraf saling berhubungan secara <b>sebab–akibat</b>, <b>pertentangan</b> (sisi positif lalu tantangan), <b>rincian/contoh</b>, <b>penegasan</b>, atau <b>simpulan/solusi</b>. Kuncinya adalah kata penghubung antarparagraf (<i>namun</i>, <i>meski demikian</i>, <i>oleh karena itu</i>, <i>selain itu</i>) dan gagasan utama tiap paragraf.`],
simpulan:['Kesimpulan dalam teks argumentasi',`Struktur argumentasi: <b>tesis → argumen → penegasan ulang/simpulan</b>. Simpulan yang baik menyatakan kembali pendirian penulis, merangkum argumen, atau menawarkan solusi, dan tidak memunculkan masalah baru. Penandanya antara lain <i>oleh karena itu</i>, <i>dengan demikian</i>, dan <i>jadi</i>.`],
watak:['Unsur intrinsik: penokohan (watak tokoh)',`Watak tokoh digambarkan melalui <b>dialog, tindakan, pikiran, dan komentar narator</b>. Simpulkan watak dari perbuatan yang konsisten sepanjang cerita, bukan dari satu adegan yang terpisah.`],
konflik:['Konflik dan penyebabnya (alur)',`<b>Konflik</b> adalah pertentangan yang menggerakkan cerita: antartokoh, tokoh dengan dirinya sendiri, atau tokoh dengan keadaan/lingkungan. Penyebabnya biasanya dijelaskan pada <b>tahap awal hingga tengah</b> alur. Pilih sebab yang disebut langsung dalam teks, bukan akibat atau peristiwa pendukung.`],
akhir:['Menentukan kelanjutan atau akhir cerita',`Kelanjutan cerita harus <b>logis dan konsisten</b> dengan watak tokoh, alur, serta petunjuk di akhir teks (harapan, janji, atau perubahan sikap). Akhir yang membuat tokoh lega adalah akhir yang menyelesaikan konflik (resolusi).`],
emosi:['Respons emosional tokoh',`Perasaan tokoh terlihat dari <b>tindakan, ucapan, dan ekspresi</b> pada saat peristiwa terjadi. Tentukan respons pada momen yang ditanyakan, bukan sebelum atau sesudahnya, lalu cocokkan dengan opsi yang memuat tindakan sekaligus maknanya.`],
urutan:['Urutan informasi dalam teks',`Urutan informasi mengikuti <b>susunan paragraf</b> teks. Buat peta singkat gagasan tiap paragraf, lalu cocokkan dengan opsi. Waspadai opsi yang memuat hal yang ada di teks tetapi urutannya terbalik.`],
amanat:['Pesan moral (amanat) tersirat',`<b>Amanat tersirat</b> disimpulkan pembaca dari sikap penulis, sindiran, dan penutup teks. Biasanya berupa ajakan umum yang bijak, tidak ekstrem, dan mencakup inti permasalahan teks.`],
sindiran:['Evaluasi: relevansi dan sindiran (ironi)',`<b>Sindiran/ironi</b> mengkritik lewat pertentangan antara yang dikatakan dan kenyataan. Menilai relevansi berarti menghubungkan kritik dalam teks dengan <b>fenomena nyata</b> yang serupa, misalnya peduli lingkungan di dunia fisik tetapi abai di dunia digital.`],
latar:['Unsur intrinsik: latar tempat',`<b>Latar</b> terdiri atas tempat, waktu, dan suasana. Latar tempat ditentukan dari <b>deskripsi lingkungan</b> (benda, tumbuhan, suasana), tidak hanya dari nama tempat. Kumpulkan beberapa petunjuk lalu cocokkan dengan opsi.`],
karakter:['Evaluasi: kesesuaian karakter dan tindakan (Benar/Salah)',`Menilai kesesuaian berarti membandingkan <b>perubahan sikap tokoh</b> dengan tindakan akhirnya, lalu menguji <b>alasan</b> tiap pernyataan terhadap bukti teks. Pernyataan bisa salah karena kesimpulannya keliru atau alasannya tidak ada di teks.`],
data:['Evaluasi: kesesuaian data dengan opini',`Opini yang kuat didukung <b>data yang relevan</b>. Periksa pasangan klaim–data satu per satu: data yang dikutip harus benar-benar menjelaskan hal yang diklaim. Pernyataan salah bila datanya ada di teks tetapi mendukung hal yang berbeda.`],
bahasa:['Evaluasi: penggunaan bahasa (pilihan kata/idiom)',`Penulis memilih kata atau idiom untuk <b>memperkuat makna</b> dan menyesuaikan gaya dengan jenis teks. Nilailah fungsi pilihan kata itu dalam kalimatnya (misalnya <i>bahu-membahu</i> menegaskan kerja sama), bukan sekadar artinya.`],
tantangan:['Menentukan tantangan/permasalahan utama teks nonfiksi',`Tantangan adalah hal yang <b>menghambat</b> tujuan yang dibahas teks. Cari kalimat yang menyebutnya langsung (biasanya berpenanda <i>namun</i>, <i>tantangan</i>, <i>risiko</i>) dan bedakan penyebab utama dari akibat yang masih berupa kemungkinan.`],
lanjut:['Menentukan kelanjutan teks nonfiksi',`Kelanjutan teks harus <b>sejalan dengan arah pembahasan</b> dan kalimat terakhir. Bandingkan opsi yang mirip dengan teliti, perhatikan perbedaan kata kecil, dan pilih yang menggunakan kerangka isi dari akhir teks.`],
isi:['Kesesuaian pernyataan dengan isi teks',`Untuk menilai pernyataan benar/salah atau sesuai/tidak sesuai, <b>cari bukti langsung di teks</b> untuk tiap pernyataan. Pernyataan salah bila bertentangan dengan teks atau memuat informasi yang tidak disebut. Waspadai kata ekstrem seperti <i>hanya</i>, <i>semua</i>, <i>tidak pernah</i>. Pada soal pilih dua, verifikasi semua opsi sebelum memilih.`],
tujuan:['Tujuan penulis',`Tujuan penulis dapat dikenali dari <b>jenis dan nada teks</b>. Teks berita atau informasi bertujuan <b>menginformasikan</b>; teks opini atau iklan bertujuan <b>membujuk</b>. Coret opsi yang bernada kritik, promosi, atau penolakan jika teks tidak menunjukkannya.`],
kalimat:['Hubungan antarkalimat dalam paragraf',`Hubungan antarkalimat dapat berupa <b>penjelasan</b>, <b>penegasan</b>, <b>pertentangan</b>, atau <b>penambahan</b>. Cari penanda seperti <i>oleh karena itu</i> (penegasan/simpulan), <i>namun</i> (pertentangan), dan <i>selain itu</i> (penambahan), lalu lihat fungsi kalimat sesudahnya.`]

function openGuide(){closeOv();const all=D.flatMap(d=>d.q),n=all.length,nb=all.filter(q=>Array.isArray(q[4])).length,nm=all.filter(q=>isM(q)).length,ng=n-nb-nm;

<div class="fb"><b>1. Pilih mode</b><ul style="margin:.3em 0 0;padding-left:1.2em"><li><b>Latihan:</b> jawaban langsung diperiksa, lengkap dengan pembahasan, tips, dan materi terkait. Timer per soal bersifat opsional.</li><li><b>Simulasi ujian:</b> waktu berjalan mundur, pembahasan baru muncul setelah ujian selesai, dan aturan anti-curang berlaku.</li></ul></div>
<div class="fb" style="margin-top:8px"><b>2. Alur mengerjakan</b><ul style="margin:.3em 0 0;padding-left:1.2em"><li>Pilih teks lewat menu <i>Teks</i>, baca sampai tuntas, lalu kerjakan soal di bawahnya.</li><li>Gunakan tombol <b>🚩 Ragu</b> untuk menandai soal yang ingin ditinjau lagi, dan <b>🔢 Navigasi soal</b> untuk melompat antarsoal.</li><li>Progres tersimpan otomatis di perangkat ini, terpisah untuk tiap paket.</li></ul></div>
<div class="fb" style="margin-top:8px"><b>3. Jenis soal di paket ini</b><ul style="margin:.3em 0 0;padding-left:1.2em"><li><b>Pilihan ganda (${ng} soal):</b> pilih satu jawaban dari opsi A–E.</li><li><b>Pilih dua (${nm} soal):</b> pilih tepat dua jawaban, lalu tekan <i>Periksa jawaban</i>. Benar jika kedua pilihan tepat.</li><li><b>Benar/Salah atau Sesuai/Tidak sesuai (${nb} soal):</b> jawab semua pernyataan, lalu tekan <i>Periksa jawaban</i>. Benar jika semua pernyataan tepat.</li></ul></div>
<div class="fb" style="margin-top:8px"><b>4. Tiga kompetensi yang diuji</b><ul style="margin:.3em 0 0;padding-left:1.2em"><li><b>Tekstual:</b> menemukan informasi yang tertulis (gagasan utama, makna kata, rincian). Jawabannya ada langsung di teks.</li><li><b>Inferensial:</b> menafsirkan yang tersirat (hubungan antarparagraf, penyebab, prediksi, pesan moral).</li><li><b>Evaluasi dan Apresiasi:</b> menilai teks (kesesuaian, relevansi, pilihan bahasa, kekuatan argumen).</li></ul></div>
<div class="fb" style="margin-top:8px"><b>5. Strategi menjawab</b><ul style="margin:.3em 0 0;padding-left:1.2em"><li>Baca teks dengan memberi label singkat tiap paragraf (misalnya: nilai, masalah, solusi).</li><li>Cari bukti di teks untuk setiap jawaban. Jangan memakai pendapat atau pengetahuan sendiri.</li><li>Coret opsi yang bertentangan dengan teks, memuat hal yang tidak disebut, atau berkata ekstrem (<i>hanya</i>, <i>semua</i>, <i>selalu</i>, <i>tidak pernah</i>).</li><li>Untuk Benar/Salah, nilai satu pernyataan sekali waktu, termasuk alasan setelah kata <i>karena</i>.</li><li>Pada soal bertanda Evaluasi, bandingkan opsi yang mirip dan perhatikan perbedaan kata kecil.</li></ul></div>
<div class="fb" style="margin-top:8px"><b>6. Mengatur waktu</b><ul style="margin:.3em 0 0;padding-left:1.2em"><li>Pedoman per soal: Tekstual 60 detik, Inferensial 90 detik, Evaluasi 120 detik, pilih dua 90 detik, Benar/Salah 150 detik.</li><li>Kerjakan soal yang pasti dulu, tandai yang ragu, lalu kembali di akhir. Jangan terlalu lama pada satu soal.</li><li>Di simulasi, ujian selesai otomatis saat waktu habis. Tombol <i>Selesaikan ujian</i> menampilkan soal yang belum dijawab dan yang ditandai ragu.</li></ul></div>
<div class="fb" style="margin-top:8px"><b>7. Setelah selesai</b><ul style="margin:.3em 0 0;padding-left:1.2em"><li>Buka <b>📊 Hasil</b> untuk nilai, capaian per kompetensi, analisis, dan rekomendasi belajar. Hasil bisa diunduh sebagai PNG.</li><li>Pilih <i>Tinjau jawaban &amp; pembahasan</i>, lalu pelajari kotak <i>Materi terkait</i> pada soal yang salah.</li></ul></div>
<div class="fb" style="margin-top:8px"><b>8. Kenyamanan membaca</b><ul style="margin:.3em 0 0;padding-left:1.2em"><li>Tombol <b>A−</b> dan <b>A+</b> mengatur ukuran huruf, dan <b>🌓</b> mengganti tema terang atau gelap.</li></ul></div>
